name: Python Linting
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v2
    - name: Set up Python
      uses: actions/setup-python@v2
      with:
        python-version: '3.8'
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install flake8
    - name: Lint with flake8
      run: |
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
# Tên của quy trình tự động hóa này
name: Python Linting

# Quy trình này sẽ được kích hoạt mỗi khi có sự kiện 'push' (đẩy code lên repository)
on: [push]

jobs:
  # Định nghĩa một công việc có tên là 'build'
  build:
    # Chạy công việc này trên máy chủ ảo sử dụng hệ điều hành Ubuntu mới nhất
    runs-on: ubuntu-latest
steps:
    # Bước 1: Sử dụng action có sẵn để sao chép (checkout) mã nguồn từ repo vào máy chủ ảo
    - uses: actions/checkout@v2
# Bước 2: Thiết lập môi trường Python trên máy chủ ảo
    - name: Set up Python
      uses: actions/setup-python@v2
      with:
        python-version: '3.8' # Cài đặt phiên bản Python 3.8

# Bước 3: Cài đặt các thư viện cần thiết
    - name: Install dependencies
      run: |
        # Nâng cấp công cụ quản lý thư viện pip
        python -m pip install --upgrade pip
        # Cài đặt flake8 - một thư viện dùng để kiểm tra lỗi code Python
        pip install flake8
# Bước 4: Thực hiện kiểm tra code (Linting) bằng flake8
    - name: Lint with flake8
      run: |
        # flake8 . : Kiểm tra toàn bộ thư mục hiện tại
        # --count : Hiển thị tổng số lỗi ở cuối bản tin
        # --select=E9,F63,F7,F82 : Chỉ tập trung vào các lỗi nghiêm trọng (lỗi cú pháp, biến chưa định nghĩa...)
        # --show-source : Hiển thị trực tiếp dòng code bị lỗi
        # --statistics : Hiển thị bảng thống kê số lượng từng loại lỗi
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
